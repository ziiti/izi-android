name: Build iZi Pet APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check project structure
        run: |
          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "Assets directory:"
          ls -la app/src/main/assets

          echo "SVG count:"
          find app/src/main/assets -type f -iname "*.svg" | wc -l

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Inspect APK assets
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          echo "APK size:"
          du -h "$APK"

          echo "Assets inside APK:"
          unzip -l "$APK" | grep -E 'assets/|\.svg$' || true

          echo "SVG count inside APK:"
          unzip -l "$APK" | grep -ic '\.svg$' || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: izi-pet-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
