plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.izi'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.izi"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        
        resConfigs "ru", "en"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Убрали proguardFiles, чтобы не требовать наличия файла proguard-rules.pro
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'
}
