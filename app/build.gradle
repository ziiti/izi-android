plugins {
    id 'com.android.application'
}

android {
    namespace 'com.izi.pet'
    compileSdk 35

    // ЭТОТ БЛОК ДОБАВЛЕН, ЧТОБЫ КАРТИНКИ ПОПАЛИ В APK
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    defaultConfig {
        applicationId 'com.izi.pet'
        minSdk 29
        // targetSdk 32 keeps the Android 10+ overlay/foreground-service
        // behavior compatible with this sideloaded prototype.
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
