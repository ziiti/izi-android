plugins {
    id 'com.android.application'
}

android {
    namespace 'com.izi.pet'
    compileSdk 35

    defaultConfig {
        applicationId 'com.izi.pet'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }

    // Явно указываем путь к assets
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Отключаем сжатие, чтобы файлы точно попали в APK
    androidResources {
        noCompress += ['svg', 'html', 'json']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
