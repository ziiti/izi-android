plugins {
    id 'com.android.application'
}

android {
    namespace 'com.izi.pet'
    compileSdk 35

    defaultConfig {
        applicationId 'com.izi.pet'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    // Говорим Gradle: "Не игнорируй файлы в assets!"
    aaptOptions {
        ignoreAssetsPattern "!.svn:!.git:!.ds_store:!*.scc:.*:<dir>_*:!CVS:!thumbs.db:!picasa.ini:!*~"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
