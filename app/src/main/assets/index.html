<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iZi</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; font-family: sans-serif; }
        /* Размеры подстраиваются под окно */
        body { background: transparent; overflow: hidden; width: 100vw; height: 100vh; position: relative; }
        
        /* Персонаж */
        #pet-container {
            position: absolute; bottom: 10px; left: 50%;
            transform: translateX(-50%);
            width: 160px; height: 200px;
            transform-origin: bottom center;
            z-index: 10;
        }
        #pet-svg-wrapper svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.15)); }

        /* Облачко */
        #cloud {
            position: absolute; top: 10px; left: 50%;
            transform: translateX(-50%) scale(0.9);
            width: 90%; max-width: 300px; min-height: 80px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #D36B9A; border-radius: 20px;
            padding: 12px; display: flex; flex-direction: column;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            transition: all 0.3s ease; opacity: 0; pointer-events: none;
            z-index: 20;
        }
        #cloud.active { opacity: 1; transform: translateX(-50%) scale(1); pointer-events: auto; }
        
        #cloud-text { font-size: 14px; color: #333; text-align: center; margin-bottom: 8px; font-weight: bold; }
        
        .input-row { display: flex; gap: 6px; }
        #chat-input { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid #ccc; font-size: 14px; outline: none; }
        .send-btn { background: #D36B9A; color: white; border: none; border-radius: 10px; padding: 8px 12px; font-weight: bold; cursor: pointer; }
        
        /* Кнопки управления */
        .controls { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); display: flex; gap: 15px; z-index: 30; }
        .ctrl-btn { width: 50px; height: 50px; border-radius: 50%; background: white; border: 2px solid #D36B9A; font-size: 24px; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .ctrl-btn:active { transform: scale(0.9); }
    </style>
</head>
<body>

    <!-- Облачко для чата -->
    <div id="cloud">
        <div id="cloud-text">Привет! Я iZi. Напиши мне что-нибудь!</div>
        <div class="input-row">
            <input type="text" id="chat-input" placeholder="Написать...">
            <button class="send-btn" onclick="sendMessage()">➤</button>
        </div>
    </div>

    <!-- Персонаж -->
    <div id="pet-container">
        <div id="pet-svg-wrapper"></div>
    </div>

    <!-- Кнопки управления -->
    <div class="controls">
        <button class="ctrl-btn" onclick="toggleCloud()">💬</button>
        <button class="ctrl-btn" onclick="startMic()">🎤</button>
    </div>

<script>
    // --- ССЫЛКА НА ТВОЙ CLOUDFLARE WORKER ---
    const WORKER_URL = 'https://wispy-pond-9c0b.zadeakber.workers.dev';

    // --- ВСТРОЕННЫЙ МАНИФЕСТ (чтобы Android не блокировал загрузку) ---
    const manifest = {
      "canvas": [400, 520],
      "parts": [
        { "id": "01_head", "file": "01_head.svg", "size": [180, 160], "pivot": [90, 80] },
        { "id": "02_hair", "file": "02_hair.svg", "size": [70, 56], "pivot": [35, 50] },
        { "id": "03_eye_left", "file": "03_eye_left.svg", "size": [60, 68], "pivot": [30, 34] },
        { "id": "04_eye_right", "file": "04_eye_right.svg", "size": [60, 68], "pivot": [30, 34] },
        { "id": "05_pupil_left", "file": "05_pupil_left.svg", "size": [30, 30], "pivot": [15, 15] },
        { "id": "06_pupil_right", "file": "06_pupil_right.svg", "size": [30, 30], "pivot": [15, 15] },
        { "id": "09_headphones", "file": "09_headphones.svg", "size": [224, 120], "pivot": [112, 70] },
        { "id": "10_brow_left", "file": "10_brow_left.svg", "size": [56, 22], "pivot": [28, 11] },
        { "id": "11_brow_right", "file": "11_brow_right.svg", "size": [56, 22], "pivot": [28, 11] },
        { "id": "13_mouth_smile", "file": "13_mouth_smile.svg", "size": [64, 44], "pivot": [32, 22] },
        { "id": "17_body", "file": "17_body.svg", "size": [150, 190], "pivot": [75, 95] },
        { "id": "18_vest", "file": "18_vest.svg", "size": [150, 190], "pivot": [75, 95] },
        { "id": "19_backpack", "file": "19_backpack.svg", "size": [190, 150], "pivot": [95, 75] },
        { "id": "20_shoulder_left", "file": "20_shoulder_left.svg", "size": [34, 62], "pivot": [17, 14] },
        { "id": "21_forearm_left", "file": "21_forearm_left.svg", "size": [32, 62], "pivot": [16, 14] },
        { "id": "22_hand_left", "file": "22_hand_left.svg", "size": [44, 48], "pivot": [22, 12] },
        { "id": "23_shoulder_right", "file": "23_shoulder_right.svg", "size": [34, 62], "pivot": [17, 14] },
        { "id": "24_forearm_right", "file": "24_forearm_right.svg", "size": [32, 62], "pivot": [16, 14] },
        { "id": "25_hand_right", "file": "25_hand_right.svg", "size": [44, 48], "pivot": [22, 12] },
        { "id": "26_thigh_left", "file": "26_thigh_left.svg", "size": [36, 56], "pivot": [18, 14] },
        { "id": "27_shin_left", "file": "27_shin_left.svg", "size": [34, 56], "pivot": [17, 14] },
        { "id": "28_foot_left", "file": "28_foot_left.svg", "size": [60, 36], "pivot": [30, 8] },
        { "id": "29_thigh_right", "file": "29_thigh_right.svg", "size": [36, 56], "pivot": [18, 14] },
        { "id": "30_shin_right", "file": "30_shin_right.svg", "size": [34, 56], "pivot": [17, 14] },
        { "id": "31_foot_right", "file": "31_foot_right.svg", "size": [60, 36], "pivot": [30, 8] }
      ]
    };

    let animTime = 0;
    let isTalking = false;

    function createImg(id) {
        const p = manifest.parts.find(x => x.id === id);
        if(!p) return '';
        return `<image href="${p.file}" x="${-p.pivot[0]}" y="${-p.pivot[1]}" width="${p.size[0]}" height="${p.size[1]}" />`;
    }

    function buildPet() {
        const wrapper = document.getElementById('pet-svg-wrapper');
        
        let eyeLeft = `<g transform="translate(162, 168)">${createImg("03_eye_left")}${createImg("05_pupil_left")}</g>`;
        let eyeRight = `<g transform="translate(238, 168)">${createImg("04_eye_right")}${createImg("06_pupil_right")}</g>`;

        wrapper.innerHTML = `
        <svg viewBox="0 0 400 520">
            <g transform="translate(200, 345)">${createImg("19_backpack")}</g>
            
            <g id="leg-left" transform="translate(176, 408)">
                ${createImg("26_thigh_left")}
                <g transform="translate(0, 36)">${createImg("27_shin_left")}</g>
                <g transform="translate(0, 72)">${createImg("28_foot_left")}</g>
            </g>
            <g id="leg-right" transform="translate(224, 408)">
                ${createImg("29_thigh_right")}
                <g transform="translate(0, 36)">${createImg("30_shin_right")}</g>
                <g transform="translate(0, 72)">${createImg("31_foot_right")}</g>
            </g>

            <g transform="translate(200, 330)">${createImg("17_body")}</g>
            <g transform="translate(200, 330)">${createImg("18_vest")}</g>

            <g transform="translate(142, 296)">${createImg("20_shoulder_left")}<g transform="translate(0, 36)">${createImg("21_forearm_left")}</g><g transform="translate(0, 70)">${createImg("22_hand_left")}</g></g>
            <g transform="translate(258, 296)">${createImg("23_shoulder_right")}<g transform="translate(0, 36)">${createImg("24_forearm_right")}</g><g transform="translate(0, 70)">${createImg("25_hand_right")}</g></g>

            <g transform="translate(200, 170)">${createImg("01_head")}</g>
            <g transform="translate(200, 160)">${createImg("09_headphones")}</g>
            <g transform="translate(200, 96)">${createImg("02_hair")}</g>
            
            <g transform="translate(162, 128)">${createImg("10_brow_left")}</g>
            <g transform="translate(238, 128)">${createImg("11_brow_right")}</g>

            ${eyeLeft}
            ${eyeRight}

            <g transform="translate(200, 208)">${createImg("13_mouth_smile")}</g>
        </svg>`;
    }

    // Анимация лапок (через CSS-классы)
    function animateLegs() {
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes swingLeft { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(10deg); } }
            @keyframes swingRight { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-10deg); } }
            #leg-left { animation: swingLeft 1s infinite ease-in-out; transform-origin: 176px 408px; }
            #leg-right { animation: swingRight 1s infinite ease-in-out; transform-origin: 224px 408px; }
        `;
        document.head.appendChild(style);
    }

    function toggleCloud() {
        const cloud = document.getElementById('cloud');
        cloud.classList.toggle('active');
    }

    async function sendMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;

        const cloudText = document.getElementById('cloud-text');
        cloudText.innerText = "Думаю...";
        input.value = '';

        try {
            const res = await fetch(WORKER_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text })
            });
            const data = await res.json();
            cloudText.innerText = data.reply;
            speakText(data.reply);
        } catch (e) {
            cloudText.innerText = "Ошибка связи. Попробуй еще раз!";
        }
    }

    function startMic() {
        if (isTalking) return;
        isTalking = true;
        document.getElementById('cloud-text').innerText = "Слушаю тебя...";
        document.getElementById('cloud').classList.add('active');
        
        setTimeout(() => {
            isTalking = false;
            document.getElementById('cloud-text').innerText = "Напиши мне лучше текстом, я пока не слышу! 😅";
        }, 2000);
    }

    function speakText(text) {
        if (window.AndroidTTS) {
            window.AndroidTTS.speak(text);
        }
    }

    window.onload = () => {
        buildPet();
        animateLegs();
    };
</script>
</body>
</html>
