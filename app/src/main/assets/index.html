<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>iZi Pet</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
body{position:relative}
#stage{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#pet{position:absolute;width:min(52vw,220px);height:auto;aspect-ratio:400/520;bottom:10px;left:0;transform-origin:50% 100%;will-change:left,transform}
#pet svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 7px 7px rgba(0,0,0,.16))}
#bubble{position:absolute;left:50%;bottom:calc(100% + 8px);transform:translateX(-50%);max-width:220px;min-width:90px;padding:8px 12px;border-radius:15px;background:rgba(255,255,255,.96);color:#263238;font:13px/1.3 sans-serif;text-align:center;box-shadow:0 3px 12px #0003;display:none;overflow-wrap:anywhere}
#pet.walking #leg-left{animation:legL .42s infinite alternate ease-in-out;transform-box:view-box;transform-origin:176px 408px}
#pet.walking #leg-right{animation:legR .42s infinite alternate ease-in-out;transform-box:view-box;transform-origin:224px 408px}
#pet.walking #arm-left{animation:armL .42s infinite alternate ease-in-out;transform-box:view-box;transform-origin:142px 296px}
#pet.walking #arm-right{animation:armR .42s infinite alternate ease-in-out;transform-box:view-box;transform-origin:258px 296px}
@keyframes legL{to{transform:rotate(13deg)}}@keyframes legR{to{transform:rotate(-13deg)}}
@keyframes armL{to{transform:rotate(-9deg)}}@keyframes armR{to{transform:rotate(9deg)}}
#pet.jumping{animation:jump .65s ease-in-out}
@keyframes jump{0%,100%{translate:0 0}45%{translate:0 -75px}}
#pet.sleeping{animation:breathe 2.2s infinite ease-in-out}
@keyframes breathe{50%{translate:0 3px}}
#zzz{display:none;position:absolute;right:3%;top:0;color:white;font:bold 18px sans-serif;text-shadow:0 1px 4px #333}
#pet.sleeping #zzz{display:block}
</style>
</head>
<body>
<div id="stage">
  <div id="pet">
    <div id="bubble"></div><div id="zzz">Z z z</div>
    <svg id="character" viewBox="0 0 400 520" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</div>
<script>
/* Exact part geometry comes from the extracted original manifest.json. */
const manifest = {"canvas":[400,520],"note":"Левый/правый: слева/справа на экране. pivot — точка сустава внутри части (px). place — куда pivot ставится в сборке. Углы: + = по часовой.","z_order":["19_backpack","legs","17_body","18_vest","arms","01_head","eyes","pupils","brows","mouth","09_headphones","02_hair"],"parts":[{"id":"01_head","name":"Голова целиком","file":"01_head.svg","size":[180,160],"pivot":[90,80],"place":[200,170]},{"id":"02_hair","name":"Волосы (3 волоска)","file":"02_hair.svg","size":[70,56],"pivot":[35,50],"place":[200,96]},{"id":"03_eye_left","name":"Левый глаз (белок)","file":"03_eye_left.svg","size":[60,68],"pivot":[30,34],"place":[162,168]},{"id":"04_eye_right","name":"Правый глаз (белок)","file":"04_eye_right.svg","size":[60,68],"pivot":[30,34],"place":[238,168]},{"id":"05_pupil_left","name":"Левый зрачок","file":"05_pupil_left.svg","size":[30,30],"pivot":[15,15],"place":[165,172]},{"id":"06_pupil_right","name":"Правый зрачок","file":"06_pupil_right.svg","size":[30,30],"pivot":[15,15],"place":[235,172]},{"id":"07_lid_left","name":"Левое веко","file":"07_lid_left.svg","size":[60,68],"pivot":[30,34],"place":[162,168]},{"id":"08_lid_right","name":"Правое веко","file":"08_lid_right.svg","size":[60,68],"pivot":[30,34],"place":[238,168]},{"id":"09_headphones","name":"Наушники (вместо очков)","file":"09_headphones.svg","size":[224,120],"pivot":[112,70],"place":[200,160]},{"id":"10_brow_left","name":"Левая бровь","file":"10_brow_left.svg","size":[56,22],"pivot":[28,11],"place":[162,128]},{"id":"11_brow_right","name":"Правая бровь","file":"11_brow_right.svg","size":[56,22],"pivot":[28,11],"place":[238,128]},{"id":"12_mouth_neutral","name":"Рот: нейтральный","file":"12_mouth_neutral.svg","size":[64,44],"pivot":[32,22],"place":[200,208]},{"id":"13_mouth_smile","name":"Рот: улыбка","file":"13_mouth_smile.svg","size":[64,44],"pivot":[32,22],"place":[200,208]},{"id":"14_mouth_open","name":"Рот: открытый","file":"14_mouth_open.svg","size":[64,44],"pivot":[32,22],"place":[200,208]},{"id":"15_mouth_sad","name":"Рот: грусть","file":"15_mouth_sad.svg","size":[64,44],"pivot":[32,22],"place":[200,208]},{"id":"16_mouth_surprise","name":"Рот: удивление","file":"16_mouth_surprise.svg","size":[64,44],"pivot":[32,22],"place":[200,208]},{"id":"17_body","name":"Тело","file":"17_body.svg","size":[150,190],"pivot":[75,95],"place":[200,330]},{"id":"18_vest","name":"Жилет с шарфом","file":"18_vest.svg","size":[150,190],"pivot":[75,95],"place":[200,330]},{"id":"19_backpack","name":"Коричневый рюкзак","file":"19_backpack.svg","size":[190,150],"pivot":[95,75],"place":[200,345]},{"id":"20_shoulder_left","name":"Левое плечо","file":"20_shoulder_left.svg","size":[34,62],"pivot":[17,14],"place":[142,296]},{"id":"21_forearm_left","name":"Левое предплечье","file":"21_forearm_left.svg","size":[32,62],"pivot":[16,14],"place":[142,332]},{"id":"22_hand_left","name":"Левая кисть","file":"22_hand_left.svg","size":[44,48],"pivot":[22,12],"place":[142,366]},{"id":"23_shoulder_right","name":"Правое плечо","file":"23_shoulder_right.svg","size":[34,62],"pivot":[17,14],"place":[258,296]},{"id":"24_forearm_right","name":"Правое предплечье","file":"24_forearm_right.svg","size":[32,62],"pivot":[16,14],"place":[258,332]},{"id":"25_hand_right","name":"Правая кисть","file":"25_hand_right.svg","size":[44,48],"pivot":[22,12],"place":[258,366]},{"id":"26_thigh_left","name":"Левое бедро","file":"26_thigh_left.svg","size":[36,56],"pivot":[18,14],"place":[176,408]},{"id":"27_shin_left","name":"Левая голень","file":"27_shin_left.svg","size":[34,56],"pivot":[17,14],"place":[176,444]},{"id":"28_foot_left","name":"Левая ступня","file":"28_foot_left.svg","size":[60,36],"pivot":[30,8],"place":[176,480]},{"id":"29_thigh_right","name":"Правое бедро","file":"29_thigh_right.svg","size":[36,56],"pivot":[18,14],"place":[224,408]},{"id":"30_shin_right","name":"Правая голень","file":"30_shin_right.svg","size":[34,56],"pivot":[17,14],"place":[224,444]},{"id":"31_foot_right","name":"Правая ступня","file":"31_foot_right.svg","size":[60,36],"pivot":[30,8],"place":[224,480]}],"rig":{"arm_left":{"parts":["20_shoulder_left","21_forearm_left","22_hand_left"],"default_angles":[12,6,0],"segment_lengths":[36,34],"root_joint":[142,296]},"arm_right":{"parts":["23_shoulder_right","24_forearm_right","25_hand_right"],"default_angles":[-12,-6,0],"segment_lengths":[36,34],"root_joint":[258,296]},"leg_left":{"parts":["26_thigh_left","27_shin_left","28_foot_left"],"default_angles":[4,-4,0],"segment_lengths":[36,34],"root_joint":[176,408]},"leg_right":{"parts":["29_thigh_right","30_shin_right","31_foot_right"],"default_angles":[-4,4,0],"segment_lengths":[36,34],"root_joint":[224,408]}},"mouths":["12_mouth_neutral","13_mouth_smile","14_mouth_open","15_mouth_sad","16_mouth_surprise"],"palette":{"outline":"#1C2B2B","body":"#3FC1B0","belly":"#8FE3D6","vest":"#4B4FA3","scarf":"#F26B4B","headphones":"#F28C28","backpack":"#8B5A2B","gloves_boots":"#1F2A44","pupil":"#3B2314"}};
const svgNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("character");
const pet = document.getElementById("pet");
const bubble = document.getElementById("bubble");
const partMap = Object.fromEntries(manifest.parts.map(p => [p.id,p]));
const hiddenLids = ["07_lid_left","08_lid_right"];
let sleeping = false, posX = 12, direction = 1, speed = 0.75;
let bubbleTimer = null;

function addPart(parent, id, extraClass) {
  const p = partMap[id];
  if (!p) return null;
  const g = document.createElementNS(svgNS,"g");
  g.setAttribute("data-part",id);
  if (extraClass) g.setAttribute("class",extraClass);
  const image = document.createElementNS(svgNS,"image");
  image.setAttribute("href",p.file);
  image.setAttributeNS("http://www.w3.org/1999/xlink","href",p.file);
  image.setAttribute("x",-p.pivot[0]);
  image.setAttribute("y",-p.pivot[1]);
  image.setAttribute("width",p.size[0]);
  image.setAttribute("height",p.size[1]);
  image.setAttribute("preserveAspectRatio","none");
  g.appendChild(image);
  g.setAttribute("transform",`translate(${p.place[0]} ${p.place[1]})`);
  parent.appendChild(g);
  return g;
}
function groupAt(id,x,y,cls) {
  const g=document.createElementNS(svgNS,"g");
  g.setAttribute("id",id);
  if(cls) g.setAttribute("class",cls);
  g.setAttribute("transform",`translate(${x} ${y})`);
  svg.appendChild(g);
  return g;
}
function addAt(parent,id,x,y) {
  const p=partMap[id]; if(!p) return;
  const g=document.createElementNS(svgNS,"g");
  g.setAttribute("data-part",id);
  g.setAttribute("transform",`translate(${x} ${y})`);
  const im=document.createElementNS(svgNS,"image");
  im.setAttribute("href",p.file);
  im.setAttributeNS("http://www.w3.org/1999/xlink","href",p.file);
  im.setAttribute("x",-p.pivot[0]); im.setAttribute("y",-p.pivot[1]);
  im.setAttribute("width",p.size[0]); im.setAttribute("height",p.size[1]);
  im.setAttribute("preserveAspectRatio","none");
  g.appendChild(im); parent.appendChild(g);
  return g;
}
function buildPet(){
  svg.innerHTML="";
  // Back item first.
  addPart(svg,"19_backpack");
  // Legs: individual segments are grouped around their hip pivot.
  const ll=groupAt("leg-left",176,408,"");
  addAt(ll,"26_thigh_left",0,0);
  addAt(ll,"27_shin_left",0,36);
  addAt(ll,"28_foot_left",0,72);
  const lr=groupAt("leg-right",224,408,"");
  addAt(lr,"29_thigh_right",0,0);
  addAt(lr,"30_shin_right",0,36);
  addAt(lr,"31_foot_right",0,72);

  addPart(svg,"17_body");
  addPart(svg,"18_vest");

  const al=groupAt("arm-left",142,296,"");
  addAt(al,"20_shoulder_left",0,0);
  addAt(al,"21_forearm_left",0,36);
  addAt(al,"22_hand_left",0,70);
  const ar=groupAt("arm-right",258,296,"");
  addAt(ar,"23_shoulder_right",0,0);
  addAt(ar,"24_forearm_right",0,36);
  addAt(ar,"25_hand_right",0,70);

  addPart(svg,"01_head");
  addPart(svg,"09_headphones");
  addPart(svg,"02_hair");
  addPart(svg,"10_brow_left");
  addPart(svg,"11_brow_right");

  // Eyes and pupils deliberately remain separate layers.
  addPart(svg,"03_eye_left","eye-white");
  addPart(svg,"04_eye_right","eye-white");
  addPart(svg,"05_pupil_left","pupil");
  addPart(svg,"06_pupil_right","pupil");

  // Both lids are present but hidden until sleep.
  hiddenLids.forEach(id => {
    const lid=addPart(svg,id,"eyelid");
    if(lid) lid.style.display="none";
  });
  setMouth("13_mouth_smile");
}
function setMouth(id){
  svg.querySelectorAll('[data-mouth="true"]').forEach(n=>n.remove());
  const p=partMap[id]; if(!p)return;
  const g=addPart(svg,id,"mouth");
  if(g) g.setAttribute("data-mouth","true");
}
function setEyesClosed(closed){
  hiddenLids.forEach(id=>{
    const el=svg.querySelector(`[data-part="${id}"]`);
    if(el) el.style.display=closed?"":"none";
  });
}
function showPetMessage(text,duration=3500){
  bubble.textContent=String(text);
  bubble.style.display="block";
  if(bubbleTimer) clearTimeout(bubbleTimer);
  if(duration>0) bubbleTimer=setTimeout(()=>bubble.style.display="none",duration);
}
function hidePetMessage(){bubble.style.display="none";if(bubbleTimer)clearTimeout(bubbleTimer);}
window.showPetMessage=showPetMessage;

function wake(){
  sleeping=false;
  pet.classList.remove("sleeping");
  setEyesClosed(false);
  pet.classList.add("walking");
}
window.petAction=function(action){
  if(action==="feed"){
    wake(); setMouth("14_mouth_open"); showPetMessage("Ням-ням! Спасибо за яблочко 🍎");
    setTimeout(()=>setMouth("13_mouth_smile"),1500);
  } else if(action==="play"){
    wake(); pet.classList.remove("jumping"); void pet.offsetWidth;
    pet.classList.add("jumping"); showPetMessage("Ура! Давай играть! ⚽");
    setTimeout(()=>pet.classList.remove("jumping"),750);
  } else if(action==="sleep"){
    sleeping=true; pet.classList.remove("walking","jumping");
    pet.classList.add("sleeping"); setEyesClosed(true);
    showPetMessage("Спокойной ночи... 💤",0);
  } else if(action==="wake"){
    wake(); hidePetMessage();
  }
};
window.onServerReply=function(reply){
  wake(); showPetMessage(reply,6000);
  setMouth("13_mouth_smile");
};
function walkFrame(){
  if(!sleeping){
    const width=pet.getBoundingClientRect().width || 190;
    const max=Math.max(0,window.innerWidth-width-4);
    posX+=speed*direction;
    if(posX>=max){posX=max;direction=-1;}
    if(posX<=0){posX=0;direction=1;}
    pet.style.left=posX+"px";
    pet.style.transform=direction<0?"scaleX(-1)":"scaleX(1)";
    pet.classList.add("walking");
  }
  requestAnimationFrame(walkFrame);
}
window.addEventListener("resize",()=>{posX=Math.min(posX,Math.max(0,innerWidth-pet.offsetWidth));});
buildPet();
pet.classList.add("walking");
requestAnimationFrame(walkFrame);
</script>
</body>
</html>
