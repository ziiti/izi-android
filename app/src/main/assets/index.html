};const svgNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("character");
const pet = document.getElementById("pet");
const bubble = document.getElementById("bubble");
const partMap = Object.fromEntries(manifest.parts.map(p => [p.id, p]));
const hiddenLids = ["07_lid_left", "08_lid_right"];
let sleeping = false, posX = 12, direction = 1, speed = 0.75;
let bubbleTimer = null;

function addPart(parent, id, extraClass) {
  const p = partMap[id];
  if (!p) return null;
  const g = document.createElementNS(svgNS, "g");
  g.setAttribute("data-part", id);
  if (extraClass) g.setAttribute("class", extraClass);
  const image = document.createElementNS(svgNS, "image");
  const base64Src = base64Images[p.file];
  if (base64Src) {
    image.setAttribute("href", base64Src);
    image.setAttributeNS("http://www.w3.org/1999/xlink", "href", base64Src);
  } else {
    image.setAttribute("href", p.file);
    image.setAttributeNS("http://www.w3.org/1999/xlink", "href", p.file);
  }
  image.setAttribute("x", -p.pivot[0]);
  image.setAttribute("y", -p.pivot[1]);
  image.setAttribute("width", p.size[0]);
  image.setAttribute("height", p.size[1]);
  image.setAttribute("preserveAspectRatio", "none");
  g.appendChild(image);
  g.setAttribute("transform", `translate(${p.place[0]} ${p.place[1]})`);
  parent.appendChild(g);
  return g;
}

function groupAt(id, x, y, cls) {
  const g = document.createElementNS(svgNS, "g");
  g.setAttribute("id", id);
  if (cls) g.setAttribute("class", cls);
  g.setAttribute("transform", `translate(${x} ${y})`);
  svg.appendChild(g);
  return g;
}

function addAt(parent, id, x, y) {
  const p = partMap[id]; if (!p) return;
  const g = document.createElementNS(svgNS, "g");
  g.setAttribute("data-part", id);
  g.setAttribute("transform", `translate(${x} ${y})`);
  const im = document.createElementNS(svgNS, "image");
  const base64Src = base64Images[p.file];
  if (base64Src) {
    im.setAttribute("href", base64Src);
    im.setAttributeNS("http://www.w3.org/1999/xlink", "href", base64Src);
  } else {
    im.setAttribute("href", p.file);
    im.setAttributeNS("http://www.w3.org/1999/xlink", "href", p.file);
  }
  im.setAttribute("x", -p.pivot[0]); im.setAttribute("y", -p.pivot[1]);
  im.setAttribute("width", p.size[0]); im.setAttribute("height", p.size[1]);
  im.setAttribute("preserveAspectRatio", "none");
  g.appendChild(im); parent.appendChild(g);
  return g;
}

function buildPet() {
  svg.innerHTML = "";
  addPart(svg, "19_backpack");

  const ll = groupAt("leg-left", 176, 408, "");
  addAt(ll, "26_thigh_left", 0, 0);
  addAt(ll, "27_shin_left", 0, 36);
  addAt(ll, "28_foot_left", 0, 72);
  const lr = groupAt("leg-right", 224, 408, "");
  addAt(lr, "29_thigh_right", 0, 0);
  addAt(lr, "30_shin_right", 0, 36);
  addAt(lr, "31_foot_right", 0, 72);

  addPart(svg, "17_body");
  addPart(svg, "18_vest");

  const al = groupAt("arm-left", 142, 296, "");
  addAt(al, "20_shoulder_left", 0, 0);
  addAt(al, "21_forearm_left", 0, 36);
  addAt(al, "22_hand_left", 0, 70);
  const ar = groupAt("arm-right", 258, 296, "");
  addAt(ar, "23_shoulder_right", 0, 0);
  addAt(ar, "24_forearm_right", 0, 36);
  addAt(ar, "25_hand_right", 0, 70);

  addPart(svg, "01_head");
  addPart(svg, "09_headphones");
  addPart(svg, "02_hair");
  addPart(svg, "10_brow_left");
  addPart(svg, "11_brow_right");

  addPart(svg, "03_eye_left", "eye-white");
  addPart(svg, "04_eye_right", "eye-white");
  addPart(svg, "05_pupil_left", "pupil");
  addPart(svg, "06_pupil_right", "pupil");

  hiddenLids.forEach(id => {
    const lid = addPart(svg, id, "eyelid");
    if (lid) lid.style.display = "none";
  });
  setMouth("13_mouth_smile");
}

function setMouth(id) {
  svg.querySelectorAll('[data-mouth="true"]').forEach(n => n.remove());
  const p = partMap[id]; if (!p) return;
  const g = addPart(svg, id, "mouth");
  if (g) g.setAttribute("data-mouth", "true");
}

function setEyesClosed(closed) {
  hiddenLids.forEach(id => {
    const el = svg.querySelector(`[data-part="${id}"]`);
    if (el) el.style.display = closed ? "" : "none";
  });
}

function showPetMessage(text, duration = 3500) {
  bubble.textContent = String(text);
  bubble.style.display = "block";
  if (bubbleTimer) clearTimeout(bubbleTimer);
  if (duration > 0) bubbleTimer = setTimeout(() => bubble.style.display = "none", duration);
}

function hidePetMessage() { bubble.style.display = "none"; if (bubbleTimer) clearTimeout(bubbleTimer); }
window.showPetMessage = showPetMessage;

function wake() {
  sleeping = false;
  pet.classList.remove("sleeping");
  setEyesClosed(false);
  pet.classList.add("walking");
}

window.petAction = function(action) {
  if (action === "feed") {
    wake(); setMouth("14_mouth_open"); showPetMessage("Ням-ням! Спасибо за яблочко 🍎");
    setTimeout(() => setMouth("13_mouth_smile"), 1500);
  } else if (action === "play") {
    wake(); pet.classList.remove("jumping"); void pet.offsetWidth;
    pet.classList.add("jumping"); showPetMessage("Ура! Давай играть! ⚽");
    setTimeout(() => pet.classList.remove("jumping"), 750);
  } else if (action === "sleep") {
    sleeping = true; pet.classList.remove("walking", "jumping");
    pet.classList.add("sleeping"); setEyesClosed(true);
    showPetMessage("Спокойной ночи... 💤", 0);
  } else if (action === "wake") {
    wake(); hidePetMessage();
  }
};

window.onServerReply = function(reply) {
  wake(); showPetMessage(reply, 6000);
  setMouth("13_mouth_smile");
};

function walkFrame() {
  if (!sleeping) {
    const width = pet.getBoundingClientRect().width || 190;
    const max = Math.max(0, window.innerWidth - width - 4);
    posX += speed * direction;
    if (posX >= max) { posX = max; direction = -1; }
    if (posX <= 0) { posX = 0; direction = 1; }
    pet.style.left = posX + "px";
    pet.style.transform = direction < 0 ? "scaleX(-1)" : "scaleX(1)";
    pet.classList.add("walking");
  }
  requestAnimationFrame(walkFrame);
}

window.addEventListener("resize", () => { posX = Math.min(posX, Math.max(0, innerWidth - pet.offsetWidth)); });
buildPet();
pet.classList.add("walking");
requestAnimationFrame(walkFrame);
</script>
